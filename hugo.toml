baseURL = 'https://nanithal.github.io/'
defaultContentLanguage = 'zh'
locale = 'zh-CN'
hasCJKLanguage = true
enableRobotsTXT = true
mainSections = ['posts']
timeZone = 'Asia/Shanghai'
title = 'Nanithal 的技术博客｜学习笔记与项目实践'
theme = 'PaperMod'


[params]
    env = 'production'
    title = 'Nanithal 的技术博客｜学习笔记与项目实践'
    description = 'Nanithal 的个人技术博客，记录 Linux 与 Arch Linux 配置、C/C++ 和 Python 编程、数据结构与算法、机器学习和嵌入式系统的学习笔记，分享项目实践中的问题、解决过程与技术思考。'
    author = 'Nanithal'
    images = ['/images/social-card.png']
    keywords = ['Nanithal', 'Linux', '编程', '算法', '机器学习', '嵌入式']
    mainSections = ['posts']
    DateFormat = '2006年1月2日'

    defaultTheme = 'dark'

    ShowReadingTime = true
    ShowShareButtons = true
    ShowPostNavLinks = true
    ShowCodeCopyButtons = true
    ShowBreadCrumbs = true
    ShowWordCount = true
    ShowRssButtonInSectionTermList = true

    ShowToc = true  # 文章页面默认显示目录
    TocOpen = true  # 目录默认展开

    # 首页介绍：可在这里修改标题、简介和兴趣方向。
    [params.homeInfoParams]
        Title = '在代码与思考之间，'
        Highlight = '持续生长。'
        Content = '你好，我是 Nanithal。在这里记录 Linux、编程与项目实践，也收藏学习路上的问题、答案和灵感。'
        Note = '把学习写成笔记，把想法变成实践。'
        Topics = ['Linux / Arch', 'C / C++', 'Python', '机器学习', '嵌入式', '算法与竞赛']

# 增加首页社交图标
[[params.socialIcons]]
    name = "github"
    url = "https://github.com/Nanithal"

# ========== Hugo + KaTeX配置LaTeX公式 ==========
[markup.goldmark.extensions.passthrough]
enable = true

[markup.goldmark.extensions.passthrough.delimiters]
block = [['\[', '\]'], ['$$', '$$']]
inline = [['\(', '\)'], ['$', '$']]



# 建立分区的相关操作
[[menu.main]]
    identifier = "home"
    name = "首页"
    url = "/"
    weight = 10

[[menu.main]]
    identifier = "posts"
    name = "文章"
    url = "/posts/"
    weight = 20

[[menu.main]]
    identifier = "categories"
    name = "分类"
    url = "/categories/"
    weight = 30

[[menu.main]]
    identifier = "tags"
    name = "标签"
    url = "/tags/"
    weight = 40

[[menu.main]]
    identifier = "archives"
    name = "归档"
    url = "/archives/"
    weight = 50

[[menu.main]]
    identifier = "about"
    name = "关于"
    url = "/about/"
    weight = 60

[[menu.main]]
    identifier = "search"
    name = "搜索"
    url = "/search/"
    weight = 70

# 代码高亮显示配置
[markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = false
    lineNos = false

[outputs]
    home = ["HTML", "RSS", "JSON"]

# 网站图标与分享卡片。
[params.assets]
    favicon = '/favicon.ico'
    favicon16x16 = '/favicon-16x16.png'
    favicon32x32 = '/favicon-32x32.png'
    apple_touch_icon = '/apple-touch-icon.png'
    safari_pinned_tab = '/safari-pinned-tab.svg'
    theme_color = '#142b32'
    msapplication_TileColor = '#142b32'

[params.schema]
    publisherType = 'Person'
    sameAs = ['https://github.com/Nanithal']

[services.rss]
    limit = 20

[sitemap]
    filename = 'sitemap.xml'

[params.analytics.google]
    SiteVerificationTag = 'b2cFt-Wr5M6k1N6AhDa9HmsfnbRRHo5tWZz1UJnKW3g'

# 导航栏保留简洁的站点名称。
[params.label]
    text = 'Nanithal 的博客'
